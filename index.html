<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Application</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <nav>
        <h1>Web Learning Project</h1>
        <ul>
            <li><a href="#contact">Contact</a></li>
            <li><a href="#todo">To-Do</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card" id="contact">
            <h2>Contact Form</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                    <span class="error-message" id="nameError">Name is required</span>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" id="emailError">Please enter a valid email</span>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                    <span class="error-message" id="messageError">Message is required</span>
                </div>
                <button type="submit">Send Message</button>
                <div class="success-message" id="successMessage">
                    Thank you! Your message has been sent successfully.
                </div>
            </form>
        </div>

        <div class="card" id="todo">
            <h2>To-Do List</h2>
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="Add a new task...">
                <button onclick="addTodo()">Add</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
